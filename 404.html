<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 // Route Not Found | Suchetha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #070b14;
      --bg-surface: #0d1527;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --tech-cyan: #38bdf8;
      --tech-cyan-glow: rgba(56, 189, 248, 0.4);
      --border-color: rgba(255, 255, 255, 0.12);
      --glass-bg: rgba(13, 21, 39, 0.75);
      --glass-blur: blur(20px);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .chassis {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 30px var(--tech-cyan-glow);
    }
    .badge {
      display: inline-block;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }
    .code {
      font-family: 'Press Start 2P', monospace;
      font-size: 3.2rem;
      color: var(--tech-cyan);
      text-shadow: 0 0 20px var(--tech-cyan-glow);
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      padding: 0.85rem 1.85rem;
      border-radius: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.3);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.45);
    }
  </style>
</head>
<body>
  <div class="chassis">
    <div class="badge">ERR // 404_PACKET_LOST</div>
    <div class="code">404</div>
    <h1>Telemetry Route Not Found</h1>
    <p>The requested route does not map to any active cluster endpoint or portfolio section. Re-synchronizing link back to main gateway.</p>
    <a href="index.html" class="btn">&larr; Return to Portfolio Gateway</a>
  </div>
</body>
</html>
